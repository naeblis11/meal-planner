org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Windows desktop app's version (plan 7): the MSI's and Settings' About. MAJOR.MINOR.BUILD, MAJOR 1 to 255,
# MINOR 0 to 255, BUILD 0 to 65535. A newer MSI replaces an older one only when this is higher: raise it for every
# installer handed out.
mealplanner.desktopVersion=1.0.2
# The Android app's version (plan 8). versionCode goes up by one with every release (Android and the update check
# compare it); versionName is what people see. tools/release.ps1 reads both, with the desktop's, for latest.json.
mealplanner.androidVersionCode=3
mealplanner.androidVersionName=1.0.2
