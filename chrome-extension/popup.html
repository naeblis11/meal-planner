<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Extract Recipe</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; width: 280px; padding: 12px; margin: 0; color: #14181a; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .preview { display: none; }
  .preview.visible { display: block; }
  .preview img { width: 100%; max-height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
  .meta { font-size: 12px; color: #545e5d; margin-bottom: 10px; }
  button { width: 100%; padding: 8px; font-size: 13px; border: none; border-radius: 6px; background: #0b6169; color: #fff; cursor: pointer; }
  button:disabled { background: #9fb2b2; cursor: default; }
  .message { font-size: 13px; margin-top: 8px; }
  .error { color: #a3352b; }
</style>
</head>
<body>
  <h1>Meal Planning — Recipe Extractor</h1>
  <div id="status" class="message">Scanning this page…</div>
  <div id="preview" class="preview">
    <img id="preview-image" hidden>
    <div id="preview-title" style="font-weight:600;"></div>
    <div id="preview-meta" class="meta"></div>
    <button id="send-button">Send to Meal Planner</button>
  </div>
  <p class="meta" style="margin-top:12px;"><a href="#" id="open-settings">Settings</a> — where the Meal Planner is</p>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
