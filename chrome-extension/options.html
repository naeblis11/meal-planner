<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meal Planner extension settings</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 520px; padding: 20px; margin: 0; color: #14181a; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border: 1px solid #c9d2d0; border-radius: 6px; }
  button { margin-top: 12px; padding: 8px 14px; font-size: 13px; border: none; border-radius: 6px; background: #0b6169; color: #fff; cursor: pointer; }
  .hint { font-size: 12px; color: #545e5d; margin: 6px 0 0; }
  .message { font-size: 13px; margin-top: 10px; }
  .error { color: #a3352b; }
  code { background: #f1f4f3; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>Where is the Meal Planner running?</h1>
  <label for="origin">App address</label>
  <input id="origin" type="url" placeholder="http://127.0.0.1:5000" spellcheck="false">
  <p class="hint">
    The Meal Planner app on this PC answers at <code>http://127.0.0.1:5000</code>, the default; it accepts
    recipes only from a browser on the same PC. A developer's preview answers at
    <code>http://127.0.0.1:5055</code>. Chrome will ask once to allow the extension to talk to another address.
  </p>
  <button id="save">Save</button>
  <div id="message" class="message"></div>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
