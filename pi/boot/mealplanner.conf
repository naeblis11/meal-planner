# Meal Planner -- first-boot settings for a Raspberry Pi.
#
# This file sits on the SD card's boot partition, which Windows shows as a
# normal drive (often E: or F:). Edit it in Notepad BEFORE putting the card
# in the Pi. Everything here is optional: anything left blank can be set
# later over SSH.
#
# The Pi wipes the secrets out of this file once it has used them, so the
# card is not left carrying your password.

# Wi-Fi, for a Pi with no Ethernet. Normally you set this in Raspberry Pi
# Imager (gear icon -> Edit settings) and leave these blank. Fill them in
# to add or change Wi-Fi without re-flashing the card: the Pi writes a
# NetworkManager profile on its first boot. WIFI_COUNTRY is the two-letter
# code for where the Pi is (US, CA, GB...); the radio stays off without it.
WIFI_SSID=
WIFI_PASSWORD=
WIFI_COUNTRY=US

# The household password for the app. Leave blank to set it later with
#   ssh <user>@<pi-name>.local 'cd Meal_Planner && .venv/bin/python set_password.py'
HOUSEHOLD_PASSWORD=

# Tailscale, for reaching the app from outside the house (optional).
# Make a key at https://login.tailscale.com/admin/settings/keys -- "Generate
# auth key", tick Reusable off, Ephemeral off, and give it 90 days. Paste it
# below and the Pi joins your tailnet by itself and serves HTTPS.
# Leave blank to skip Tailscale, or to run `sudo tailscale up` yourself later.
TAILSCALE_AUTH_KEY=

# Which git repository and branch to install from. Change only if you have
# forked the project.
REPO_URL=https://github.com/naeblis11/meal-planner.git
REPO_BRANCH=pi
